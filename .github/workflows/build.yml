name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npx electron-builder --mac --arm64 --publish never
            artifact: mac-arm64
          - os: macos-15-intel
            command: npx electron-builder --mac --x64 --publish never
            artifact: mac-intel
          - os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Stepfolio-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
